cargo-features = ["workspace-inheritance"]

[package]
name = "sai"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sai"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { git = "https://github.com/coral-xyz/anchor", tag = "v0.24.2", features = ["init-if-needed"] }
anchor-spl = { git = "https://github.com/coral-xyz/anchor", tag = "v0.24.2" }
spl-token = "3.2.0"
solana-program = "1.9.13"
