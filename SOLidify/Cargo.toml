[workspace]
members = [
    "programs/sai",
    "programs/sld"
]
resolver = "2"

[workspace.dependencies]
anchor-lang = "0.28.0"
anchor-spl = "0.28.0"
spl-token = "4.0.0"
bytemuck = "1.13.1"
bytemuck_derive = "1.4.0"
solana-program = "1.17.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1 